<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Santulan architecture</title>
<style>
  @page { size: 1600px 1000px; margin: 0; }
  html, body { margin: 0; background: #ffffff; font-family: "DejaVu Sans", Arial, sans-serif; }
  svg { display: block; }
  .t { font-size: 14.5px; fill: #1f2933; }
  .h { font-size: 16.5px; font-weight: 700; fill: #0b0b0b; }
  .s { font-size: 13px; fill: #52514e; }
  .lane { font-size: 13px; font-weight: 700; fill: #52514e; letter-spacing: 1.5px; }
  .box { fill: #ffffff; stroke: #c9c8c2; stroke-width: 1.5; }
  .core { fill: #eef4fc; stroke: #2a78d6; stroke-width: 2; }
  .key { fill: #fff4ec; stroke: #eb6834; stroke-width: 2; }
  .muted { fill: #f6f6f4; stroke: #c9c8c2; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .arrow { stroke: #8d8c86; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8d8c86"/>
    </marker>
  </defs>
  <text x="48" y="56" style="font-size:27px;font-weight:700;fill:#0b0b0b">Santulan: a research prototype for clinician-led diabetes dose review</text>
  <text x="48" y="86" class="s" style="font-size:15.5px">Architecture and data flow. Each part is labelled by its status. The clinician decides; the software never changes a dose.</text>
  <!-- legend -->
  <rect x="1010" y="100" width="14" height="14" rx="3" fill="#2a78d6"/><text x="1030" y="112" class="s">implemented / evaluated</text>
  <rect x="1202" y="100" width="14" height="14" rx="3" fill="#eb6834"/><text x="1222" y="112" class="s">illustrative / experimental</text>
  <rect x="1408" y="100" width="14" height="14" rx="3" fill="#8d8c86"/><text x="1428" y="112" class="s">example / proposed</text>

  <text x="48" y="140" class="lane">INPUTS</text>
  <text x="470" y="140" class="lane">THE TWIN, ONE PER PATIENT</text>
  <text x="1150" y="140" class="lane">OUTPUTS TO THE CLINICIAN</text>

  <!-- Inputs -->
  <rect x="48" y="152" width="370" height="170" rx="10" class="box"/>
  <text x="68" y="180" class="h">Clinic record (EHR)</text>
  <text x="68" y="205" class="t">Age, HbA1c, eGFR, C-peptide, BMI</text>
  <text x="68" y="228" class="t">Medicines and dose records</text>
  <text x="68" y="251" class="t">CYP2C9, G6PD where tested (else unknown)</text>
  <text x="68" y="283" class="chip" fill="#8d8c86">EXAMPLE SHAPES</text>
  <text x="68" y="303" class="s">FHIR R4 modelled on the ABDM guide; not validated</text>

  <rect x="48" y="340" width="370" height="170" rx="10" class="box"/>
  <text x="68" y="368" class="h">CGM and daily logs</text>
  <text x="68" y="393" class="t">CGM every 15 min; 5 days calibrate the twin</text>
  <text x="68" y="416" class="t">Fingersticks, meals, insulin and tablet doses</text>
  <text x="68" y="448" class="chip" fill="#2a78d6">REAL DATA</text>
  <text x="68" y="468" class="s">ShanghaiT2DM: 100 adults with Type 2 diabetes,</text>
  <text x="68" y="487" class="s">109 sensor periods (CC BY 4.0)</text>

  <rect x="48" y="528" width="370" height="140" rx="10" class="muted"/>
  <text x="68" y="556" class="h">Smartwatch</text>
  <text x="68" y="581" class="t">Heart rate, steps, sleep</text>
  <text x="68" y="613" class="chip" fill="#8d8c86">DISPLAY ONLY</text>
  <text x="68" y="633" class="s">Synthetic Health Connect shapes;</text>
  <text x="68" y="652" class="s">not used by any model</text>

  <!-- Twin -->
  <rect x="470" y="152" width="620" height="516" rx="12" class="box" style="fill:#fafaf8"/>
  <rect x="494" y="170" width="572" height="104" rx="10" class="core"/>
  <text x="514" y="198" class="h">1. Calibration (fixed 5 days)</text>
  <text x="514" y="223" class="t">Sensor offset from calibration fingersticks only, then frozen;</text>
  <text x="514" y="246" class="t">meal fill and baseline drug flags from calibration records</text>
  <text x="1050" y="186" class="chip" fill="#2a78d6" text-anchor="end">IMPLEMENTED</text>

  <rect x="494" y="288" width="572" height="112" rx="10" class="core"/>
  <text x="514" y="316" class="h">2. Physiology core (fitted per person)</text>
  <text x="514" y="341" class="t">Linearised Bergman minimal model with insulin, sulfonylurea,</text>
  <text x="514" y="364" class="t">GLP-1 and meal curves; sign-constrained least squares</text>
  <text x="514" y="388" class="s">Lowers 2-hour error by 2.2 mg/dL (1.1 in the full hybrid), held-out patients</text>
  <text x="1050" y="304" class="chip" fill="#2a78d6" text-anchor="end">IMPLEMENTED</text>

  <rect x="494" y="414" width="572" height="112" rx="10" class="core"/>
  <text x="514" y="442" class="h">3. Learning layer (LightGBM, across patients)</text>
  <text x="514" y="467" class="t">CGM history, logged inputs, clinical record, core forecasts;</text>
  <text x="514" y="490" class="t">tested only on patients excluded from its training (5 patient folds)</text>
  <text x="514" y="514" class="s">The clinical record did not improve forecast accuracy</text>
  <text x="1050" y="430" class="chip" fill="#2a78d6" text-anchor="end">EVALUATED</text>

  <rect x="494" y="540" width="572" height="112" rx="10" class="key"/>
  <text x="514" y="568" class="h">4. Review rules and safety notes</text>
  <text x="514" y="593" class="t">GLP-1 start, weight loss, planned fast, eGFR below 60;</text>
  <text x="514" y="616" class="t">G6PD deficiency, CYP2C9 variant, age 65 and over</text>
  <text x="514" y="640" class="s">Stated rules with label notes, judged as of a date; not validated</text>
  <text x="1050" y="556" class="chip" fill="#eb6834" text-anchor="end">RULES</text>

  <!-- Outputs -->
  <rect x="1150" y="152" width="402" height="92" rx="10" class="core"/>
  <text x="1170" y="180" class="h">Glucose forecast, 30 / 60 / 120 min</text>
  <text x="1170" y="205" class="t">RMSE 13.2 / 23.0 / 32.6 mg/dL</text>
  <text x="1170" y="228" class="s">vs 16.6 / 27.6 / 40.7 for no change</text>

  <rect x="1150" y="256" width="402" height="92" rx="10" class="core"/>
  <text x="1170" y="284" class="h">Low alert (simple rule)</text>
  <text x="1170" y="309" class="t">Corrected reading at or below its threshold</text>
  <text x="1170" y="332" class="s">43 of 53 lows at 0.5 alerts a day; models not better</text>

  <rect x="1150" y="360" width="402" height="92" rx="10" class="key"/>
  <text x="1170" y="388" class="h">Dose scenarios</text>
  <text x="1170" y="413" class="t">Options side by side on the person's core</text>
  <text x="1170" y="436" class="s">Illustrative; assumptions and sensitivity shown</text>

  <rect x="1150" y="464" width="402" height="92" rx="10" class="key"/>
  <text x="1170" y="492" class="h">Sensor-off estimation</text>
  <text x="1170" y="517" class="t">RMSE 29.6 mg/dL from doses, meals, fingersticks</text>
  <text x="1170" y="540" class="s">Experimental: no low detection; at most 8.0 days tested</text>

  <rect x="1150" y="568" width="402" height="100" rx="10" class="core"/>
  <text x="1170" y="596" class="h">Clinician dashboard (Streamlit)</text>
  <text x="1170" y="621" class="t">Live replay of a held-out real patient, review</text>
  <text x="1170" y="644" class="t">list, scenarios, evidence. The clinician decides.</text>

  <path class="arrow" d="M418 237 H466"/>
  <path class="arrow" d="M418 425 H466"/>
  <path class="arrow" d="M780 274 V284"/>
  <path class="arrow" d="M780 400 V410"/>
  <path class="arrow" d="M780 526 V536"/>
  <path class="arrow" d="M1090 198 H1146"/>
  <path class="arrow" d="M1090 302 H1146"/>
  <path class="arrow" d="M1090 406 H1146"/>
  <path class="arrow" d="M1090 510 H1146"/>
  <path class="arrow" d="M1150 640 H1110 V700 H243 V672"/>
  <text x="290" y="722" class="s">The clinician's decision changes the patient; a new sensor period recalibrates the twin (no online refitting)</text>

  <!-- Lifecycle and evaluation -->
  <text x="48" y="748" class="lane">LIFECYCLE</text>
  <rect x="48" y="762" width="350" height="96" rx="10" class="core"/>
  <text x="68" y="790" class="h">Calibrate</text>
  <text x="68" y="814" class="t">CGM fortnight, fingersticks and</text>
  <text x="68" y="836" class="t">labs fit offset and core</text>
  <rect x="430" y="762" width="350" height="96" rx="10" class="core"/>
  <text x="450" y="790" class="h">Watch, with the CGM on</text>
  <text x="450" y="814" class="t">Forecasts and the simple alert;</text>
  <text x="450" y="836" class="t">live replay shows this loop</text>
  <rect x="812" y="762" width="350" height="96" rx="10" class="key"/>
  <text x="832" y="790" class="h">Review and discuss</text>
  <text x="832" y="814" class="t">Rules flag the record; options</text>
  <text x="832" y="836" class="t">compared under stated assumptions</text>
  <rect x="1194" y="762" width="358" height="96" rx="10" class="muted"/>
  <text x="1214" y="790" class="h">Re-sense (proposed)</text>
  <text x="1214" y="814" class="t">Quarterly sensor periods; cost and</text>
  <text x="1214" y="836" class="t">safety need a prospective pilot</text>
  <path class="arrow" d="M398 810 H426"/>
  <path class="arrow" d="M780 810 H808"/>
  <path class="arrow" d="M1162 810 H1190"/>

  <rect x="48" y="880" width="1504" height="78" rx="10" class="box" style="fill:#fafaf8"/>
  <text x="68" y="908" class="h">Evaluation protocol v2 (docs/evaluation_protocol.md)</text>
  <text x="68" y="934" class="t">Calibration-only personal state; offset prior, models and alert thresholds fitted on training patients only; one alert policy and one-to-one scoring;</text>
  <text x="68" y="952" class="t">the live replay matches the evaluation's stored predictions (tested). Stack: Python, pandas, SciPy, LightGBM, Streamlit, Plotly. Apache-2.0.</text>
</svg>
</body>
</html>
